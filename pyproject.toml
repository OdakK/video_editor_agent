[project]
name = "video-agent"
version = "0.2.0"
description = "Conversational video editing agent: analyzes rushes (Whisper, scene detection, BLIP), searches them and builds an OpenTimelineIO rough cut with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.2",
    "langgraph>=0.2.60",
    "langchain-openai>=1.0.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6",
    "numpy>=1.26.0",
    "opentimelineio>=0.17",
]

[project.optional-dependencies]
# Heavy ML models, only needed to analyze rushes and embed them for semantic search.
analysis = [
    "faster-whisper>=1.0.0",
    "scenedetect==0.6.7",
    "opencv-python>=4.8.1",
    "pillow>=10.2.0",
    "transformers>=4.37.2",
    "torch>=2.1.2",
    "sentence-transformers>=2.7.0",
]
anthropic = ["langchain-anthropic>=1.0"]
studio = ["langgraph-cli[inmem]>=0.4.6", "langgraph-api>=0.4.9"]

[project.scripts]
video-agent = "video_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["ffmpeg: needs ffmpeg and ffprobe on PATH"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
