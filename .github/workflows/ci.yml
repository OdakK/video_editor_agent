name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (used by the end-to-end render test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The opentimelineio 0.18.0 Linux wheels contain modules built for CPython 3.7
      # (_opentime.cpython-37m-*.so), so they cannot be imported on 3.12: build it from source.
      - run: uv sync --no-binary-package opentimelineio
      - name: Lint
        run: uv run ruff check .
      - name: Tests (store, timeline, real ffmpeg render, agent with a scripted model)
        run: uv run pytest -v
