<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Editor Agent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff6b4a'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">Video Editor Agent</span>
      <span class="chip" id="model-chip" title="LLM used by the agent">…</span>
    </div>
    <div class="actions">
      <button class="btn ghost" id="reset-btn" title="Empty the timeline and the conversation">New edit</button>
      <button class="btn primary" id="render-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        Render preview
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="panel library" aria-labelledby="library-title">
      <div class="panel-head">
        <h2 id="library-title">Shots</h2>
        <span class="count" id="shot-count"></span>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="filter" type="search" placeholder="Filter by words, caption, rush…" autocomplete="off">
      </label>
      <div class="shot-list" id="shot-list" aria-live="polite"></div>
    </section>

    <section class="panel stage" aria-label="Preview and timeline">
      <div class="player">
        <video id="player" controls playsinline hidden></video>
        <div class="player-empty" id="player-empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>
          <p>No preview yet</p>
          <span>Add shots to the timeline, then render, or ask the agent.</span>
        </div>
      </div>

      <div class="timeline-wrap">
        <div class="panel-head">
          <h2>Timeline</h2>
          <span class="count" id="timeline-duration"></span>
        </div>
        <div class="ruler" id="ruler" aria-hidden="true"></div>
        <ol class="timeline" id="timeline" aria-label="Clips in order"></ol>
      </div>
    </section>

    <section class="panel chat" aria-labelledby="chat-title">
      <div class="panel-head">
        <h2 id="chat-title">Agent</h2>
        <span class="status" id="agent-status">Ready</span>
      </div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="welcome" id="welcome">
          <p>Describe the edit you want. The agent searches your rushes by meaning or by words, then builds the timeline.</p>
          <div class="suggestions" id="suggestions">
            <button>Start with the wide beach shot, then the sunset</button>
            <button>Find where he talks about Lisbon and put it first</button>
            <button>Cut the first clip at 3 seconds and remove its first half</button>
            <button>Render a preview and describe the timeline</button>
          </div>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Ask for an edit…" aria-label="Message to the agent"></textarea>
        <button class="btn primary icon" id="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
